<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you · Ellsford Estimating</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Manrope:wght@400;600&display=swap">
<style>
:root{--moss:#322C25;--ivory:#F3ECE0;--caramel:#B28558;--on:#B5A893;--line:#4C443A}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--moss);color:var(--ivory);font:400 16px/1.7 "Manrope",system-ui,sans-serif;padding:24px}
main{max-width:520px;text-align:center}
img{height:56px;width:auto;margin:0 auto 36px;display:block}
.label{font:600 .7rem/1 "Manrope",sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--caramel)}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(2.4rem,7vw,3.4rem);line-height:1.05;margin:16px 0 0}
h1 em{color:var(--caramel)}
p{color:var(--on);margin:18px 0 0}
a.btn{display:inline-block;margin-top:32px;background:var(--caramel);color:#1f1a15;text-decoration:none;font-weight:600;font-size:.9rem;padding:13px 22px;border-radius:2px}
a.btn:hover{background:#c2946a}
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="Ellsford Estimating">
  <div class="label">Received</div>
  <h1>Thank you. <em>We're on it.</em></h1>
  <p>Your details reached us. We'll reply within one business day with a fixed price and delivery date.</p>
  <a class="btn" href="/">Back to the site</a>
</main>
</body>
</html>
